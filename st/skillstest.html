<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Metal Elements Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body class="bg-light">

    <div class="container my-5" style="max-width: 650px;">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <div class="bg-primary text-white text-center py-4 px-3">
                <h1 class="fw-bold mb-1">Non-Metal Elements</h1>
                <p class="mb-0 text-white-50">Periodic Table Information Finder</p>
            </div>
            <div class="card-body p-4 bg-white">
                <div class="alert alert-danger border-0 rounded-3 mb-4" role="alert">
                    <strong>Instructions:</strong> Enter the <strong>symbol</strong> of a non-metal element (Example: H, O, Cl, Ne, Xe).
                </div>
                <div class="mb-3">
                    <label for="element-input" class="form-label fw-semibold text-secondary">Element Symbol</label>
                    <input type="text" id="element-input" class="form-control form-control-lg rounded-3 border-2" placeholder="e.g. O, Cl, Rn">
                </div>
                <button py-click="check_element" class="btn btn-danger btn-lg w-100 rounded-3 fw-bold shadow-sm mb-4">
                    Check Details
                </button>
                <div class="card border-primary border-2 rounded-3 bg-light">
                    <div class="card-body">
                        <h5 class="card-title text-primary fw-bold mb-3">Result</h5>
                        <div id="result" class="text-dark fs-5">
                            <span class="text-muted">Enter a symbol above and click check details.</span>
                        </div>
                    </div>
                </div>

            </div>

            <div class="card-footer bg-white text-center text-muted py-3 border-0 small">
                <span class="text-danger fw-semibold">Skills Test</span> • Non-Metal Elements Tracker
            </div>
        </div>
    </div>

    <!-- le script -->
    <script type="py">
        from pyscript import document

        def check_element(e):
            non_metals = {
                "H": ("Hydrogen", "1", "1.008"),
                "He": ("Helium", "2", "4.003"),
                "C": ("Carbon", "6", "12.011"),
                "N": ("Nitrogen", "7", "14.007"),
                "O": ("Oxygen", "8", "15.999"),
                "F": ("Fluorine", "9", "18.998"),
                "Ne": ("Neon", "10", "20.180"),
                "P": ("Phosphorus", "15", "30.974"),
                "S": ("Sulfur", "16", "32.06"),
                "Cl": ("Chlorine", "17", "35.45"),
                "Ar": ("Argon", "18", "39.948"),
                "Se": ("Selenium", "34", "78.971"),
                "Br": ("Bromine", "35", "79.904"),
                "Kr": ("Krypton", "36", "83.798"),
                "I": ("Iodine", "53", "126.90"),
                "Xe": ("Xenon", "54", "131.29"),
                "Rn": ("Radon", "86", "222")
            }

            raw_input = document.getElementById("element-input").value.strip()
            
            # input symbol check
            if len(raw_input) == 1:
                symbol_key = raw_input.upper()
            elif len(raw_input) == 2:
                symbol_key = raw_input[0].upper() + raw_input[1].lower()
            else:
                symbol_key = raw_input.capitalize()

            # checking/looking up with dictionary and boolean
            is_found = symbol_key in non_metals
            element_name, atomic_num, atomic_mass = non_metals.get(symbol_key, ("Not Found", "-", "-"))

            # tuple output indexed by boolen
            outputs = (
                f"<span class='text-danger'>Symbol '{raw_input}' not found in non-metals list.</span>",
                f"<b>Symbol:</b> {symbol_key} <br><b>Element:</b> {element_name} <br><b>Atomic Number:</b> {atomic_num} <br><b>Atomic Mass:</b> {atomic_mass}"
            )

            document.getElementById("result").innerHTML = outputs[is_found]
    </script>

</body>
</html>
